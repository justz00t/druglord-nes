# UxROM (mapper 2): 3 switchable 16 KB banks (A, B, font) + 16 KB fixed; CHR-RAM; 8 KB battery WRAM at $6000
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0180;
}
MEMORY {
    ZP:     file = "", start = $0002, size = $001A, type = rw, define = yes;
    HEADER: file = %O, start = $0000, size = $0010, fill = yes;
    BANKA:  file = %O, start = $8000, size = $4000, fill = yes;
    BANKB:  file = %O, start = $8000, size = $4000, fill = yes;
    BANKF:  file = %O, start = $8000, size = $4000, fill = yes;
    ROM0:   file = %O, start = $C000, size = $3FFA, fill = yes, define = yes;
    ROMV:   file = %O, start = $FFFA, size = $0006, fill = yes;
    RAM:    file = "", start = $0300, size = $0380, define = yes;
    STACK:  file = "", start = $0680, size = __STACKSIZE__, define = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    HEADER:   load = HEADER, type = ro;
    CODE_A:   load = BANKA, type = ro;
    RODATA_A: load = BANKA, type = ro;
    CODE_B:   load = BANKB, type = ro;
    RODATA_B: load = BANKB, type = ro;
    FONT:     load = BANKF, type = ro;
    STARTUP:  load = ROM0, type = ro, define = yes;
    LOWCODE:  load = ROM0, type = ro, optional = yes;
    ONCE:     load = ROM0, type = ro, optional = yes;
    INIT:     load = ROM0, type = ro, define = yes, optional = yes;
    CODE:     load = ROM0, type = ro, define = yes;
    RODATA:   load = ROM0, type = ro, define = yes;
    DATA:     load = ROM0, run = RAM, type = rw, define = yes;
    VECTORS:  load = ROMV, type = ro;
    BSS:      load = RAM,  type = bss, define = yes;
}
